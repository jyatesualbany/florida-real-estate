[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-foreclosed-condos"
version = "0.1.0"
description = "Agent that collects Florida foreclosed condo listings from public county records into a CSV."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fl-foreclosed-condos = "fl_foreclosed_condos.cli:run"

[tool.setuptools]
packages = [
    "fl_foreclosed_condos",
    "fl_foreclosed_condos.sources",
    "fl_foreclosed_condos.sources.enrichment",
]

[tool.setuptools.package-data]
fl_foreclosed_condos = ["config/*.yaml"]
