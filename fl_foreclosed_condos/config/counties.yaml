# Florida county foreclosure auction sources.
#
# IMPORTANT: `subdomain` values here are based on general public knowledge
# that these counties' clerks contract with the RealForeclose/RealAuction
# platform. They were NOT verified against the live sites in this session
# (outbound fetch was unavailable), so confirm each subdomain and the
# `selectors` block below against the real page before relying on them --
# vendor platforms change deployments and county contracts over time.
#
# To add a county: add an entry under `counties`, set `platform`, and
# either rely on the shared `selectors` defaults or override them per
# county if that county's page markup differs.

counties:
  miami-dade:
    display_name: "Miami-Dade County"
    platform: realforeclose
    subdomain: miamidade
